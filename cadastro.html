<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitar cadastro · ETHOS Industrial</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f0f3f8;font:14px 'Segoe UI',Arial,sans-serif;display:grid;place-items:center;padding:20px;color:#1f3046}.card{background:white;width:min(530px,100%);border-radius:20px;padding:35px;box-shadow:0 20px 60px #1d2c461a}.card img{width:150px}.card h1{font-size:26px}.card p{color:#66788c;line-height:1.6}label{display:block;margin:18px 0 7px;font-weight:700;font-size:12px}input{width:100%;padding:12px;border:1px solid #dce4ec;border-radius:10px;font:inherit}button{width:100%;border:0;background:#a31f45;color:white;font:inherit;font-weight:800;padding:14px;border-radius:10px;margin-top:22px;cursor:pointer}button:disabled{opacity:.55}a{color:#a31f45}.msg{margin-top:15px;padding:12px;background:#fff0f3;color:#8f2040;border-radius:10px}</style></head><body><main class="card"><img src="ethos-logo.png" alt="ETHOS"><h1>Solicitar acesso ao ETHOS</h1><p>O cadastro ficará pendente até a aprovação do administrador. Utilize um e-mail corporativo válido para recuperação de senha.</p><form id="form"><label for="username">Usuário (3 a 48 caracteres)</label><input id="username" pattern="[A-Za-z0-9._-]{3,48}" minlength="3" maxlength="48" autocomplete="username" required><label for="email">E-mail corporativo</label><input id="email" type="email" autocomplete="email" required><label for="password">Senha (mínimo 12 caracteres)</label><input id="password" type="password" minlength="12" autocomplete="new-password" required><label for="confirm">Confirmar senha</label><input id="confirm" type="password" minlength="12" autocomplete="new-password" required><button id="submit">Solicitar cadastro</button></form><div id="msg" class="msg" role="status" hidden></div><p><a href="login.html">Voltar ao login</a></p></main>
<script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const cfg=window.ETHOS_FIREBASE_CONFIG,msg=document.getElementById('msg'),submit=document.getElementById('submit');function show(t){msg.hidden=false;msg.textContent=t}
if(!cfg||String(cfg.apiKey).includes('SUBSTITUIR')||String(cfg.projectId).includes('SEU_PROJETO'))show('Configure firebase-config.js antes de publicar.');else firebase.initializeApp(cfg);
document.getElementById('form').onsubmit=async e=>{e.preventDefault();submit.disabled=true;msg.hidden=true;let cred=null;try{
 if(!firebase.apps.length)throw Error('Firebase não configurado.');const username=document.getElementById('username').value.trim().toLowerCase(),email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;
 if(password!==document.getElementById('confirm').value)throw Error('As senhas não coincidem.');if(!/^[a-z0-9._-]{3,48}$/.test(username))throw Error('Usuário inválido.');
 cred=await firebase.auth().createUserWithEmailAndPassword(email,password);
 const db=firebase.firestore(),batch=db.batch(),uid=cred.user.uid;
 batch.set(db.collection('users').doc(uid),{username,email,role:'common',active:false,approval_status:'pending',created_at:new Date().toISOString()});
 batch.set(db.collection('usernames').doc(username),{uid});await batch.commit();
 await firebase.auth().signOut();show('Solicitação enviada. Aguarde aprovação do administrador para entrar.');document.getElementById('form').reset();
 }catch(err){if(cred?.user){try{await cred.user.delete()}catch{}}show(err.code==='auth/email-already-in-use'?'E-mail já cadastrado.':err.code==='permission-denied'?'Nome de usuário já utilizado ou regras de segurança ainda não publicadas.':err.message||'Falha ao solicitar cadastro.');}finally{submit.disabled=false}
};
</script></body></html>
